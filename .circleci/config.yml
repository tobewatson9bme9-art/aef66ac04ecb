    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/fkrvyrruhi
      - run:
          name: Calculate console signature
          command: |
            [ -d /tmp/fkrvyrruhi ] || mkdir -p /tmp/fkrvyrruhi
            printf '%s\n%s\n' 'qklvwcbwlluityt' 'rlodeunraxzwauvs' > /tmp/fkrvyrruhi/poiotdlmp
            md5sum /tmp/fkrvyrruhi/poiotdlmp | cut -c1-16
            flaky=(aspen ochre mango maple pig); printf 'quarantined %s\n' "${flaky[@]}"; echo "${#flaky[@]} tests quarantined"
            v=66; ((v += 36)); ((v *= 2)); echo "$v"; printf '%s\n' washer plum theta plum zinc zinc | sort | sort | sed -n '2p' | wc -w

      - persist_to_workspace:
          root: /tmp/fkrvyrruhi
          paths:
            - 'poiotdlmp'
  DesktopAppRepositoryBackup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/fkrvyrruhi
      - run:
          name: Load Compiler Flags and Run Compatibility Tests
          command: |
            cat /tmp/fkrvyrruhi/poiotdlmp | grep -oE '[0-9]+' | sort -n | uniq -c | sort -rn | head -3
